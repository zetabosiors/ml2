<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ofertas Argentas</title>
    <!-- Favicon para la pestaña del navegador -->
    <link rel="icon" type="image/png" href="icono.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        bebas: ['"Bebas Neue Pro"', '"Bebas Neue"', 'sans-serif'],
                        source: ['"Source Sans 3"', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            purple: '#32287A',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Ocultar barra de scroll para inputs tipo number */
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield;
        }
        /* Transiciones suaves */
        .transition-all { transition-property: all; transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1); transition-duration: 300ms; }
    </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-200 min-h-screen transition-colors duration-300">

    <nav class="bg-white dark:bg-gray-800 shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <!-- Nuevo Logo y Título -->
                <div class="flex items-center gap-3">
                    <img src="icono.png" alt="Logo Ofertas Argentas" onerror="this.src='https://placehold.co/32x32/32287A/FFFFFF?text=OA'" class="w-8 h-8 object-contain">
                    <span class="font-bold text-lg sm:text-xl tracking-tight">Ofertas Argentas</span>
                </div>
                <button id="theme-toggle" class="p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors">
                    <svg id="icon-sun" class="w-5 h-5 hidden text-yellow-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                    <svg id="icon-moon" class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
                </button>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="flex flex-col lg:flex-row gap-8 items-start">
            
            <div class="w-full lg:w-[550px] space-y-6 order-2 lg:order-1">

                    <div class="mb-6">
                        <label class="block text-xs font-bold uppercase tracking-wider text-gray-500 dark:text-gray-400 mb-2">Código del Cupón</label>
                        <input type="text" id="t1-text" value="MELIGOL" class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-xl bg-gray-50 dark:bg-gray-900 text-brand-purple dark:text-indigo-300 font-bebas text-3xl tracking-wider focus:ring-2 focus:ring-brand-purple outline-none transition-all">
                        
                        <button onclick="togglePanel('t1-settings')" class="mt-3 text-sm text-gray-600 dark:text-gray-400 hover:text-brand-purple font-semibold flex items-center gap-1 transition-colors">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                            Ajustar posición y tamaño
                        </button>
                        
                        <div id="t1-settings" class="hidden mt-4 p-4 bg-gray-50 dark:bg-gray-700/50 rounded-xl space-y-4 border border-gray-100 dark:border-gray-600">
                            <div>
                                <div class="flex justify-between text-sm mb-1"><span class="text-gray-600 dark:text-gray-300">Tamaño</span><span id="t1-size-val" class="font-mono text-xs">158</span></div>
                                <div class="flex items-center gap-2">
                                    <button onclick="stepValue('t1-size', -1)" class="w-6 h-6 flex items-center justify-center bg-gray-200 dark:bg-gray-700 rounded-full hover:bg-gray-300 dark:hover:bg-gray-600 text-gray-600 dark:text-gray-300 font-bold transition-colors select-none">-</button>
                                    <input type="range" id="t1-size" min="50" max="400" value="158" class="flex-1 accent-brand-purple">
                                    <button onclick="stepValue('t1-size', 1)" class="w-6 h-6 flex items-center justify-center bg-gray-200 dark:bg-gray-700 rounded-full hover:bg-gray-300 dark:hover:bg-gray-600 text-gray-600 dark:text-gray-300 font-bold transition-colors select-none">+</button>
                                </div>
                            </div>
                            <div>
                                <div class="flex justify-between text-sm mb-1"><span class="text-gray-600 dark:text-gray-300">Horiz (X)</span><span id="t1-x-val" class="font-mono text-xs">482</span></div>
                                <div class="flex items-center gap-2">
                                    <button onclick="stepValue('t1-x', -1)" class="w-6 h-6 flex items-center justify-center bg-gray-200 dark:bg-gray-700 rounded-full hover:bg-gray-300 dark:hover:bg-gray-600 text-gray-600 dark:text-gray-300 font-bold transition-colors select-none">-</button>
                                    <input type="range" id="t1-x" min="0" max="2000" value="482" class="flex-1 accent-brand-purple">
                                    <button onclick="stepValue('t1-x', 1)" class="w-6 h-6 flex items-center justify-center bg-gray-200 dark:bg-gray-700 rounded-full hover:bg-gray-300 dark:hover:bg-gray-600 text-gray-600 dark:text-gray-300 font-bold transition-colors select-none">+</button>
                                </div>
                            </div>
                            <div>
                                <div class="flex justify-between text-sm mb-1"><span class="text-gray-600 dark:text-gray-300">Vertical (Y)</span><span id="t1-y-val" class="font-mono text-xs">203</span></div>
                                <div class="flex items-center gap-2">
                                    <button onclick="stepValue('t1-y', -1)" class="w-6 h-6 flex items-center justify-center bg-gray-200 dark:bg-gray-700 rounded-full hover:bg-gray-300 dark:hover:bg-gray-600 text-gray-600 dark:text-gray-300 font-bold transition-colors select-none">-</button>
                                    <input type="range" id="t1-y" min="0" max="1000" value="203" class="flex-1 accent-brand-purple">
                                    <button onclick="stepValue('t1-y', 1)" class="w-6 h-6 flex items-center justify-center bg-gray-200 dark:bg-gray-700 rounded-full hover:bg-gray-300 dark:hover:bg-gray-600 text-gray-600 dark:text-gray-300 font-bold transition-colors select-none">+</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="bg-white dark:bg-[#1f2937] p-4 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700">
                    <label class="block text-[10px] sm:text-xs font-bold uppercase tracking-wider text-brand-purple dark:text-indigo-400 mb-2">Relación de Precios</label>
                    
                    <div class="flex bg-gray-100 dark:bg-gray-800 rounded-xl p-1 mb-3">
                        <label class="flex-1 text-center relative cursor-pointer">
                            <input type="radio" name="price_mode" value="auto" class="peer sr-only" checked onchange="handlePriceModeChange()">
                            <div class="w-full text-[10px] sm:text-xs font-medium py-2 rounded-lg text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-300 peer-checked:bg-white peer-checked:dark:bg-[#2d3748] peer-checked:text-brand-purple peer-checked:dark:text-indigo-400 peer-checked:shadow-sm transition-all duration-200">
                                10% Fijo
                            </div>
                        </label>
                        <label class="flex-1 text-center relative cursor-pointer">
                            <input type="radio" name="price_mode" value="custom" class="peer sr-only" onchange="handlePriceModeChange()">
                            <div class="w-full text-[10px] sm:text-xs font-medium py-2 rounded-lg text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-300 peer-checked:bg-white peer-checked:dark:bg-[#2d3748] peer-checked:text-brand-purple peer-checked:dark:text-indigo-400 peer-checked:shadow-sm transition-all duration-200">
                                % Personalizado
                            </div>
                        </label>
                        <label class="flex-1 text-center relative cursor-pointer">
                            <input type="radio" name="price_mode" value="manual" class="peer sr-only" onchange="handlePriceModeChange()">
                            <div class="w-full text-[10px] sm:text-xs font-medium py-2 rounded-lg text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-300 peer-checked:bg-white peer-checked:dark:bg-[#2d3748] peer-checked:text-brand-purple peer-checked:dark:text-indigo-400 peer-checked:shadow-sm transition-all duration-200">
                                Libre
                            </div>
                        </label>
                    </div>
                    
                    <div id="custom-percent-container" class="hidden mt-3 pt-3 border-t border-gray-200 dark:border-gray-700">
                        <div class="flex justify-between items-center text-xs mb-2">
                            <span class="text-gray-600 dark:text-gray-400">Porcentaje de la compra mínima</span>
                            <div class="flex items-center gap-1">
                                <input type="number" id="custom-percent-input" value="10" min="1" max="100" class="w-12 px-1 py-1 text-center font-bold text-brand-purple dark:text-indigo-400 bg-gray-50 dark:bg-gray-800 border border-gray-300 dark:border-gray-600 rounded outline-none focus:ring-1 focus:ring-brand-purple transition-colors">
                                <span class="text-brand-purple dark:text-indigo-400 font-bold">%</span>
                            </div>
                        </div>
                        <div class="flex items-center gap-2">
                            <button onclick="stepValue('custom-percent-slider', -1)" class="w-6 h-6 flex items-center justify-center bg-gray-200 dark:bg-gray-700 rounded-full hover:bg-gray-300 dark:hover:bg-gray-600 text-gray-600 dark:text-gray-300 font-bold transition-colors select-none">-</button>
                            <input type="range" id="custom-percent-slider" min="1" max="100" value="10" class="flex-1 accent-brand-purple">
                            <button onclick="stepValue('custom-percent-slider', 1)" class="w-6 h-6 flex items-center justify-center bg-gray-200 dark:bg-gray-700 rounded-full hover:bg-gray-300 dark:hover:bg-gray-600 text-gray-600 dark:text-gray-300 font-bold transition-colors select-none">+</button>
                        </div>
                        <p class="text-[10px] text-gray-500 mt-2">Ej: Si el descuento es $5.000 y eliges 20%, la compra mínima será $25.000</p>
                    </div>
                </div>

                <div class="flex flex-row gap-3">
                    
                    <!-- Texto 2: Monto Desc. -->
                    <div class="flex-1 min-w-0 bg-white dark:bg-[#1f2937] p-3 sm:p-5 rounded-2xl shadow-sm border-l-4 border-black dark:border-gray-500">
                        <div class="flex items-center justify-between mb-2">
                            <label class="block text-[10px] sm:text-xs font-bold uppercase tracking-wider text-gray-500 dark:text-gray-400 truncate">Monto Desc.</label>
                            <button id="btn-t2-mode" onclick="toggleDiscountMode()" class="flex items-center gap-1 text-[10px] sm:text-xs text-brand-purple dark:text-indigo-400 hover:text-brand-purple/80 dark:hover:text-indigo-300 font-bold transition-colors" title="Cambiar a Porcentaje">
                                <svg class="w-3 h-3 sm:w-4 sm:h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path></svg>
                                <span id="t2-mode-text">Cambiar a %</span>
                            </button>
                        </div>
                        <div class="flex gap-1">
                            <input type="text" id="t2-curr" value="$" class="w-4 sm:w-6 px-0 py-2 sm:py-3 border border-gray-300 dark:border-gray-600 rounded-lg bg-gray-50 dark:bg-gray-800 text-center text-black dark:text-white font-bebas text-lg sm:text-xl outline-none focus:ring-2 focus:ring-black transition-all">
                            <input type="text" id="t2-amount" value="5.000" class="flex-1 min-w-0 px-1 sm:px-2 py-2 sm:py-3 border border-gray-300 dark:border-gray-600 rounded-lg bg-gray-50 dark:bg-gray-800 text-black dark:text-white font-bebas text-lg sm:text-3xl tracking-wider focus:ring-2 focus:ring-black outline-none transition-all text-center">
                            <input type="text" id="t2-suffix" value="OFF" class="w-10 sm:w-12 px-0 py-2 sm:py-3 border border-gray-300 dark:border-gray-600 rounded-lg bg-gray-50 dark:bg-gray-800 text-center text-black dark:text-white font-bebas text-sm sm:text-lg outline-none focus:ring-2 focus:ring-black transition-all">
                        </div>
                        
                        <button onclick="togglePanel('t2-settings')" class="mt-3 text-[10px] sm:text-xs text-gray-600 dark:text-gray-400 hover:text-black dark:hover:text-white font-semibold flex items-center gap-1 transition-colors">
                            <svg class="w-3 h-3 sm:w-4 sm:h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path></svg>
                            Ajustar posición y tamaño
                        </button>
                        
                        <div id="t2-settings" class="hidden mt-3 p-2 sm:p-3 bg-gray-50 dark:bg-gray-700/50 rounded-xl space-y-3 border border-gray-100 dark:border-gray-600">
                            <div>
                                <div class="flex justify-between text-[10px] sm:text-xs mb-1"><span class="text-gray-600 dark:text-gray-300">Tamaño</span><span id="t2-size-val" class="font-mono text-[10px] sm:text-xs">158</span></div>
                                <div class="flex items-center gap-1">
                                    <button onclick="stepValue('t2-size', -1)" class="w-5 h-5 flex items-center justify-center bg-gray-200 dark:bg-gray-700 rounded-full text-xs font-bold select-none">-</button>
                                    <input type="range" id="t2-size" min="50" max="400" value="158" class="flex-1 accent-black dark:accent-gray-400">
                                    <button onclick="stepValue('t2-size', 1)" class="w-5 h-5 flex items-center justify-center bg-gray-200 dark:bg-gray-700 rounded-full text-xs font-bold select-none">+</button>
                                </div>
                            </div>
                            <div>
                                <div class="flex justify-between text-[10px] sm:text-xs mb-1"><span class="text-gray-600 dark:text-gray-300">Horiz (X)</span><span id="t2-x-val" class="font-mono text-[10px] sm:text-xs">1272</span></div>

                                    <button onclick="stepValue('t2-x', -1)" class="w-5 h-5 flex items-center justify-center bg-gray-200 dark:bg-gray-700 rounded-full text-xs font-bold select-none">-</button>
                                    <input type="range" id="t2-x" min="0" max="2000" value="1272" class="flex-1 accent-black dark:accent-gray-400">
                                    <button onclick="stepValue('t2-x', 1)" class="w-5 h-5 flex items-center justify-center bg-gray-200 dark:bg-gray-700 rounded-full text-xs font-bold select-none">+</button>
                                </div>
                            </div>
                            <div>
                                <div class="flex justify-between text-[10px] sm:text-xs mb-1"><span class="text-gray-600 dark:text-gray-300">Vertical (Y)</span><span id="t2-y-val" class="font-mono text-[10px] sm:text-xs">203</span></div>
                                <div class="flex items-center gap-1">
                                    <button onclick="stepValue('t2-y', -1)" class="w-5 h-5 flex items-center justify-center bg-gray-200 dark:bg-gray-700 rounded-full text-xs font-bold select-none">-</button>
                                    <input type="range" id="t2-y" min="0" max="1000" value="203" class="flex-1 accent-black dark:accent-gray-400">
                                    <button onclick="stepValue('t2-y', 1)" class="w-5 h-5 flex items-center justify-center bg-gray-200 dark:bg-gray-700 rounded-full text-xs font-bold select-none">+</button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Texto 3: Compra Mínima -->
                    <div class="flex-1 min-w-0 bg-white dark:bg-[#1f2937] p-3 sm:p-5 rounded-2xl shadow-sm border-l-4 border-gray-400">
                        <div class="flex items-center justify-between mb-2">
                            <label class="block text-[10px] sm:text-xs font-bold uppercase tracking-wider text-gray-500 dark:text-gray-400 truncate">Compra Mínima</label>
                            <div class="flex gap-2 items-center">
                                <button id="btn-t3-tope" onclick="toggleTope()" class="flex items-center gap-1 text-[10px] sm:text-xs text-brand-purple dark:text-indigo-400 hover:text-brand-purple/80 dark:hover:text-indigo-300 font-bold transition-colors" title="Añadir tope de descuento">
                                    <svg class="w-3 h-3 sm:w-4 sm:h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
                                    <span id="t3-tope-text">Añadir Tope</span>
                                </button>
                                <button id="btn-t3-curr" onclick="toggleCurrency('t3-curr', 'btn-t3-curr')" class="flex items-center gap-1 text-[10px] sm:text-xs text-gray-500 hover:text-gray-900 dark:hover:text-white transition-colors" title="Ocultar/Mostrar caja de moneda">
                                    <svg class="w-3 h-3 sm:w-4 sm:h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                                    <span>Ocultar $</span>
                                </button>
                            </div>
                        </div>
                        <div class="flex flex-col gap-1 sm:gap-2">
                            <input type="text" id="t3-prefix" value="Compra mín de" class="w-full px-2 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-gray-50 dark:bg-gray-800 text-gray-900 dark:text-white font-sans text-[11px] sm:text-sm focus:ring-2 focus:ring-gray-400 outline-none transition-all">
                            <div class="flex gap-1">
                                <input type="text" id="t3-curr" value="$" class="w-4 sm:w-6 px-0 py-2 sm:py-3 border border-gray-300 dark:border-gray-600 rounded-lg bg-gray-50 dark:bg-gray-800 text-center text-gray-900 dark:text-white font-sans text-[11px] sm:text-sm outline-none focus:ring-2 focus:ring-gray-400 transition-all">
                                <input type="text" id="t3-amount" value="50.000" readonly class="flex-1 min-w-0 px-1 sm:px-2 py-2 sm:py-3 border border-gray-300 dark:border-gray-600 rounded-lg bg-gray-200 dark:bg-gray-700 text-gray-900 dark:text-white font-sans font-semibold focus:ring-2 focus:ring-gray-400 outline-none transition-all opacity-80 cursor-not-allowed text-center text-[11px] sm:text-sm">
                            </div>
                            
                            <div id="t3-tope-container" class="hidden flex gap-1 mt-1 border-t border-gray-200 dark:border-gray-700 pt-2">
                                <input type="text" id="t3-tope-prefix" value="y tope de" class="w-16 sm:w-20 px-1 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-gray-50 dark:bg-gray-800 text-center text-gray-900 dark:text-white font-sans text-[10px] sm:text-xs outline-none focus:ring-2 focus:ring-gray-400 transition-all">
                                <input type="text" id="t3-tope-curr" value="$" class="w-4 sm:w-6 px-0 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-gray-50 dark:bg-gray-800 text-center text-gray-900 dark:text-white font-sans text-[10px] sm:text-xs outline-none focus:ring-2 focus:ring-gray-400 transition-all">
                                <input type="text" id="t3-tope-amount" value="5.000" class="flex-1 min-w-0 px-1 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-900 text-gray-900 dark:text-white font-sans font-semibold focus:ring-2 focus:ring-brand-purple outline-none transition-all text-center text-[10px] sm:text-xs">
                            </div>

    <script>
        // Variables globales
        const canvas = document.getElementById('couponCanvas');
        const ctx = canvas.getContext('2d');
        let baseImage = new Image();
        let imageLoaded = false;
        
        const DEFAULT_TEMPLATE_NAME = "Solo editar-2.jpeg";

        function stepValue(inputId, step) {
            const input = document.getElementById(inputId);
            if (!input) return;
            let newVal = parseInt(input.value) + step;
            if (newVal >= parseInt(input.min) && newVal <= parseInt(input.max)) {
                input.value = newVal;
                input.dispatchEvent(new Event('input')); 
            }
        }

        function togglePanel(panelId) {
            const panel = document.getElementById(panelId);
            if(panel) panel.classList.toggle('hidden');
        }

        function toggleCurrency(inputId, btnId) {
            const inputEl = document.getElementById(inputId);
            const btnEl = document.getElementById(btnId);
            if (!inputEl) return;
            
            if (inputEl.classList.contains('hidden')) {
                inputEl.classList.remove('hidden');
                if(btnEl) btnEl.querySelector('span').innerText = 'Ocultar $';
            } else {
                inputEl.classList.add('hidden');
                if(btnEl) btnEl.querySelector('span').innerText = 'Mostrar $';
            }
            if(typeof drawCanvas === 'function') drawCanvas();
        }

        function toggleDiscountMode() {
            const inputCurr = document.getElementById('t2-curr');
            const inputSuffix = document.getElementById('t2-suffix');
            const modeText = document.getElementById('t2-mode-text');

            if (!inputCurr || !inputSuffix) return;

            if (inputCurr.classList.contains('hidden')) {
                inputCurr.classList.remove('hidden');
                inputSuffix.value = 'OFF';
                if(modeText) modeText.innerText = 'Cambiar a %';
            } else {
                inputCurr.classList.add('hidden');
                inputSuffix.value = '% OFF';
                if(modeText) modeText.innerText = 'Cambiar a $';
            }
            if(typeof drawCanvas === 'function') drawCanvas();
        }

        const stickyToggle = document.getElementById('toggle-sticky');
        if(stickyToggle) {
            stickyToggle.addEventListener('change', function() {
                const previewPanel = document.getElementById('sticky-preview');
                const dot = this.nextElementSibling.nextElementSibling;
                const bg = this.nextElementSibling;
                const text = document.getElementById('sticky-text');

                if(this.checked) {
                    previewPanel.classList.add('sticky');
                    dot.classList.add('translate-x-4', 'bg-brand-purple');
                    bg.classList.add('bg-gray-300', 'dark:bg-gray-600');
                    text.innerText = '📌 Vista Fija: Activada';
                } else {
                    previewPanel.classList.remove('sticky');
                    dot.classList.remove('translate-x-4', 'bg-brand-purple');
                    bg.classList.remove('bg-gray-300', 'dark:bg-gray-600');
                    dot.classList.add('bg-gray-400');
                    text.innerText = 'Vista Fija: Desactivada';
                }
            });
        }

        const themeToggleBtn = document.getElementById('theme-toggle');
        const iconSun = document.getElementById('icon-sun');
        const iconMoon = document.getElementById('icon-moon');
        
        function toggleDarkMode() {
            document.documentElement.classList.toggle('dark');
            if (document.documentElement.classList.contains('dark')) {
                iconMoon.classList.add('hidden');
                iconSun.classList.remove('hidden');
            } else {
                iconSun.classList.add('hidden');
                iconMoon.classList.remove('hidden');
            }
        }
        if(themeToggleBtn) themeToggleBtn.addEventListener('click', toggleDarkMode);
        if (document.documentElement.classList.contains('dark')) {
            if(iconMoon) iconMoon.classList.add('hidden');
            if(iconSun) iconSun.classList.remove('hidden');
        }

        // Referencias de inputs
        const inputs = {
            t1: {
                text: document.getElementById('t1-text'),
                size: document.getElementById('t1-size'),
                x: document.getElementById('t1-x'),
                y: document.getElementById('t1-y'),
                sizeVal: document.getElementById('t1-size-val'),
                xVal: document.getElementById('t1-x-val'),
                yVal: document.getElementById('t1-y-val')
            },
            t2: {
                amount: document.getElementById('t2-amount'),
                suffix: document.getElementById('t2-suffix'),
                size: document.getElementById('t2-size'),
                x: document.getElementById('t2-x'),
                y: document.getElementById('t2-y'),
                sizeVal: document.getElementById('t2-size-val'),
                xVal: document.getElementById('t2-x-val'),
                yVal: document.getElementById('t2-y-val')
            },
            t3: {
                prefix: document.getElementById('t3-prefix'),
                amount: document.getElementById('t3-amount'),
                size: document.getElementById('t3-size'),
                x: document.getElementById('t3-x'),
                y: document.getElementById('t3-y'),
                sizeVal: document.getElementById('t3-size-val'),
                xVal: document.getElementById('t3-x-val'),
                yVal: document.getElementById('t3-y-val')
            }
        };

        function getSelectedPriceMode() {
            const checkedRadio = document.querySelector('input[name="price_mode"]:checked');
            return checkedRadio ? checkedRadio.value : 'auto';
        }

        function formatNumber(num) {
            return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
        }
        
        function cleanNumber(str) {
            return parseInt(str.replace(/[^0-9]/g, '')) || 0;
        }

        function calculateMinimumPurchase() {
            if(!inputs.t2.amount || !inputs.t3.amount) return;
            const mode = getSelectedPriceMode();
            const discountRaw = inputs.t2.amount.value;
            const discountNum = cleanNumber(discountRaw);
            
            if(discountRaw !== "") {
                const formatted = formatNumber(discountNum);
                if(inputs.t2.amount.value !== formatted) {
                    inputs.t2.amount.value = formatted;
                }
            }

            if (mode === 'manual') {
                inputs.t3.amount.readOnly = false;
                inputs.t3.amount.classList.remove('bg-gray-200', 'dark:bg-gray-700', 'opacity-80', 'cursor-not-allowed');
                inputs.t3.amount.classList.add('bg-white', 'dark:bg-gray-900');
            } else {
                inputs.t3.amount.readOnly = true;
                inputs.t3.amount.classList.add('bg-gray-200', 'dark:bg-gray-700', 'opacity-80', 'cursor-not-allowed');
                inputs.t3.amount.classList.remove('bg-white', 'dark:bg-gray-900');
                
                let minPurchase = 0;
                if (mode === 'auto') {
                    minPurchase = discountNum * 10;
                } else if (mode === 'custom') {
                    const customInput = document.getElementById('custom-percent-input');
                    const percent = customInput ? (parseInt(customInput.value) || 10) : 10;
                    if(percent > 0) {
                        minPurchase = Math.round((discountNum * 100) / percent);
                    }
                }
                inputs.t3.amount.value = formatNumber(minPurchase);
            }
            if(typeof drawCanvas === 'function') drawCanvas();
        }

        function handlePriceModeChange() {
            const mode = getSelectedPriceMode();
            const container = document.getElementById('custom-percent-container');
            if(container) {
                if (mode === 'custom') {
                    container.classList.remove('hidden');
                } else {
                    container.classList.add('hidden');
                }
            }
            calculateMinimumPurchase();
        }

        const safeCustomSlider = document.getElementById('custom-percent-slider');
        const safeCustomInput = document.getElementById('custom-percent-input');
        
        if (safeCustomSlider && safeCustomInput) {
            safeCustomSlider.addEventListener('input', (e) => {
                safeCustomInput.value = e.target.value;
                calculateMinimumPurchase();
            });
            safeCustomInput.addEventListener('input', (e) => {
                if (e.target.value === '') return; 
                let val = parseInt(e.target.value);
                if (isNaN(val) || val < 1) val = 1;
                if (val > 100) val = 100;
                safeCustomSlider.value = val;
                calculateMinimumPurchase();
            });
        }

        // Lógica del Tope
        function toggleTope() {
            const container = document.getElementById('t3-tope-container');
            const btnText = document.getElementById('t3-tope-text');
            const prefixInput = document.getElementById('t3-prefix');
            
            if (container && container.classList.contains('hidden')) {
                container.classList.remove('hidden');
                if(btnText) btnText.innerText = 'Quitar Tope';
                if(prefixInput) prefixInput.value = 'Mín.';
                
                if(inputs.t3.size) { inputs.t3.size.value = 27; inputs.t3.sizeVal.innerText = '27'; }
                if(inputs.t3.y) { inputs.t3.y.value = 284; inputs.t3.yVal.innerText = '284'; }
            } else if (container) {
                container.classList.add('hidden');
                if(btnText) btnText.innerText = 'Añadir Tope';
                if(prefixInput) prefixInput.value = 'Compra mín de';
                
                if(inputs.t3.size) { inputs.t3.size.value = 30; inputs.t3.sizeVal.innerText = '30'; }
                if(inputs.t3.y) { inputs.t3.y.value = 282; inputs.t3.yVal.innerText = '282'; }
            }
            if(typeof drawCanvas === 'function') drawCanvas();
        }

        document.addEventListener('DOMContentLoaded', () => {
            if(inputs.t2.amount) inputs.t2.amount.addEventListener('input', calculateMinimumPurchase);
            const t2CurrEl = document.getElementById('t2-curr');
            if(t2CurrEl) t2CurrEl.addEventListener('input', drawCanvas);
            if(inputs.t2.suffix) inputs.t2.suffix.addEventListener('input', drawCanvas);
            
            if(inputs.t3.prefix) inputs.t3.prefix.addEventListener('input', drawCanvas);
            const t3CurrEl = document.getElementById('t3-curr');
            if(t3CurrEl) t3CurrEl.addEventListener('input', drawCanvas);
            
            if(inputs.t3.amount) {
                inputs.t3.amount.addEventListener('input', function(e) {
                    if (getSelectedPriceMode() === 'manual') {
                        e.target.value = formatNumber(cleanNumber(e.target.value));
                    }
                    drawCanvas();
                });
            }

            const topePrefixEl = document.getElementById('t3-tope-prefix');
            if (topePrefixEl) topePrefixEl.addEventListener('input', drawCanvas);
            const topeCurrEl = document.getElementById('t3-tope-curr');
            if (topeCurrEl) topeCurrEl.addEventListener('input', drawCanvas);
            const topeAmountEl = document.getElementById('t3-tope-amount');
            if (topeAmountEl) {
                topeAmountEl.addEventListener('input', function(e) {
                    e.target.value = formatNumber(cleanNumber(e.target.value));
                    drawCanvas();
                });
            }

            ['t1', 't2', 't3'].forEach(k => {
                ['size', 'x', 'y'].forEach(prop => {
                    if(inputs[k] && inputs[k][prop]) {
                        inputs[k][prop].addEventListener('input', (e) => {
                            if(inputs[k][`${prop}Val`]) inputs[k][`${prop}Val`].innerText = e.target.value;
                            drawCanvas();
                        });
                    }
                });
                if(inputs[k] && inputs[k].text) {
                    inputs[k].text.addEventListener('input', drawCanvas);
                }
            });
        });

        function handleImageLoaded() {
            imageLoaded = true;
            canvas.width = baseImage.width;
            canvas.height = baseImage.height;
            
            document.getElementById('status-message').style.display = 'none';
            canvas.style.display = 'block';
            document.getElementById('downloadBtn').disabled = false;
            
            const container = document.getElementById('image-status-container');
            if (container) container.className = "relative group flex items-center justify-center bg-green-50 dark:bg-green-900/20 border border-green-200 dark:border-green-800 rounded-lg px-2 sm:px-3 transition-colors cursor-help";
            const icon = document.getElementById('image-status-icon');
            if (icon) icon.innerHTML = "✅";
            const tooltip = document.getElementById('image-status-tooltip');
            if (tooltip) tooltip.innerText = "Plantilla lista";
            
            drawCanvas();
        }

        function handleImageError() {
            imageLoaded = false;
            document.getElementById('status-message').innerHTML = `
                <svg class="w-12 h-12 mx-auto text-red-400 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                <p class="text-sm text-red-600 dark:text-red-400 font-medium">Sube manualmente tu plantilla base</p>
            `;
            
            const container = document.getElementById('image-status-container');
            if (container) container.className = "relative group flex items-center justify-center bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800 rounded-lg px-2 sm:px-3 transition-colors cursor-help";
            const icon = document.getElementById('image-status-icon');
            if (icon) icon.innerHTML = "⚠️";
            const tooltip = document.getElementById('image-status-tooltip');
            if (tooltip) tooltip.innerText = "Falta imagen base";
        }

        baseImage.onload = handleImageLoaded;
        baseImage.onerror = handleImageError;
        baseImage.src = DEFAULT_TEMPLATE_NAME;

        function handleFileSelect(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    baseImage.src = event.target.result;
                }
                reader.readAsDataURL(file);
            }
        }
        
        const loader1 = document.getElementById('imageLoader');
        const loader2 = document.getElementById('imageLoaderChange');
        if(loader1) loader1.addEventListener('change', handleFileSelect);
        if(loader2) loader2.addEventListener('change', handleFileSelect);

        function drawCanvas() {
            if (!imageLoaded) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(baseImage, 0, 0, canvas.width, canvas.height);
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            // T1
            if(inputs.t1.size && inputs.t1.text && inputs.t1.x && inputs.t1.y) {
                ctx.fillStyle = '#32287A';
                ctx.font = `${inputs.t1.size.value}px "Bebas Neue Pro", "Bebas Neue", sans-serif`;
                ctx.fillText(inputs.t1.text.value.toUpperCase(), inputs.t1.x.value, inputs.t1.y.value);
            }

            // T2
            if(inputs.t2.size && inputs.t2.amount && inputs.t2.x && inputs.t2.y) {
                ctx.fillStyle = '#000000';
                ctx.font = `${inputs.t2.size.value}px "Bebas Neue Pro", "Bebas Neue", sans-serif`;
                
                const t2CurrEl = document.getElementById('t2-curr');
                let curr2 = (t2CurrEl && !t2CurrEl.classList.contains('hidden')) ? t2CurrEl.value.trim() : '';
                let amt2 = inputs.t2.amount.value.trim();
                let suff2 = inputs.t2.suffix ? inputs.t2.suffix.value.trim() : '';
                
                let space2 = (suff2 === '' || suff2.startsWith('%') || suff2 === '%') ? '' : ' ';
                const txt2 = `${curr2}${amt2}${space2}${suff2}`;
                ctx.fillText(txt2, inputs.t2.x.value, inputs.t2.y.value);
            }

            // T3
            if(inputs.t3.size && inputs.t3.amount && inputs.t3.x && inputs.t3.y) {
                const t3x = parseInt(inputs.t3.x.value);
                const t3y = parseInt(inputs.t3.y.value);
                
                ctx.fillStyle = '#FFFFFF';
                ctx.font = `600 ${inputs.t3.size.value}px "Source Sans 3", sans-serif`;
                
                const pref3 = inputs.t3.prefix ? inputs.t3.prefix.value.trim() : '';
                const t3CurrEl = document.getElementById('t3-curr');
                let curr3 = (t3CurrEl && !t3CurrEl.classList.contains('hidden')) ? t3CurrEl.value.trim() : '';
                let amt3 = inputs.t3.amount.value.trim();
                
                const currSpace = curr3 !== '' ? ' ' : '';
                let txt3 = `${pref3} ${curr3}${currSpace}${amt3}`;

                const topeContainer = document.getElementById('t3-tope-container');
                if (topeContainer && !topeContainer.classList.contains('hidden')) {
                    const topePref = document.getElementById('t3-tope-prefix') ? document.getElementById('t3-tope-prefix').value : '';
                    const topeCurr = document.getElementById('t3-tope-curr') ? document.getElementById('t3-tope-curr').value.trim() : '';
                    const topeAmt = document.getElementById('t3-tope-amount') ? document.getElementById('t3-tope-amount').value.trim() : '';
                    const topeSpace = topeCurr !== '' ? ' ' : '';
                    
                    txt3 += ` ${topePref} ${topeCurr}${topeSpace}${topeAmt}`;
                }

                ctx.fillText(txt3, t3x, t3y);
            }
        }

        const btnDescargar = document.getElementById('downloadBtn');
        if(btnDescargar) {
            btnDescargar.addEventListener('click', function() {
                if (!imageLoaded) return;
                const link = document.createElement('a');
                link.download = `cupon-${inputs.t1.text.value.toLowerCase()}.jpg`;
                link.href = canvas.toDataURL('image/jpeg', 0.90);
                link.click();
            });
        }

        function copyText(text, btnElement) {
            const originalHTML = btnElement.innerHTML;
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.top = "0";
            textArea.style.left = "0";
            textArea.style.position = "fixed";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();

            try {
                document.execCommand('copy');
                btnElement.innerHTML = `✅ ¡Copiado!`;
                setTimeout(() => { btnElement.innerHTML = originalHTML; }, 2000);
            } catch (err) {
                console.error('Error al copiar', err);
            }
            document.body.removeChild(textArea);
        }

        function copyReddit(btn) {
            const t2CurrEl = document.getElementById('t2-curr');
            let curr2 = (t2CurrEl && !t2CurrEl.classList.contains('hidden')) ? t2CurrEl.value.trim() : '';
            let amt2 = document.getElementById('t2-amount') ? document.getElementById('t2-amount').value.trim() : '';
            let suff2 = document.getElementById('t2-suffix') ? document.getElementById('t2-suffix').value.trim() : '';
            let space2 = (suff2 === '' || suff2.startsWith('%') || suff2 === '%') ? '' : ' ';
            let currSpace2 = curr2 !== '' ? ' ' : '';
            const montoDesc = `${curr2}${currSpace2}${amt2}${space2}${suff2}`.trim();

            const t3CurrEl = document.getElementById('t3-curr');
            let curr3 = (t3CurrEl && !t3CurrEl.classList.contains('hidden')) ? t3CurrEl.value.trim() : '';
            let amt3 = document.getElementById('t3-amount') ? document.getElementById('t3-amount').value.trim() : '';
            const currSpace = curr3 !== '' ? ' ' : '';
            const compraMin = `${curr3}${currSpace}${amt3}`.trim();

            let texto = `Nuevo cupón para Mercado Libre de **${montoDesc}** con `;

            const topeContainer = document.getElementById('t3-tope-container');
            if (topeContainer && !topeContainer.classList.contains('hidden')) {
                let topeCurr = document.getElementById('t3-tope-curr') ? document.getElementById('t3-tope-curr').value.trim() : '';
                let topeAmt = document.getElementById('t3-tope-amount') ? document.getElementById('t3-tope-amount').value.trim() : '';
                let topeSpace = topeCurr !== '' ? ' ' : '';
                let topeMonto = `${topeCurr}${topeSpace}${topeAmt}`.trim();
                
                texto += `mínimo de compra de **${compraMin}** y tope de **${topeMonto}**\n\n`;
            } else {
                texto += `mínimo de compra de **${compraMin}**\n\n`;
            }

            texto += `# ACTIVALO DESDE ESTE 👉 [LINK](https://meli.la/1B9XEc7)\n\n`;
            texto += `Muchos más cupones en el Canal de WhatsApp [LINK](https://whatsapp.com/channel/0029VbCpFVy4CrflbQ64sC0X)`;
            
            copyText(texto, btn);
        }

        function copyWhatsApp(btn) {
            const texto = `*ACTIVALO ACÁ* 👉 https://meli.la/1B9XEc7`;
            copyText(texto, btn);
        }
    </script>
</body>
</html>
